[project]
name = "rag-cours"
version = "0.1.0"
description = "RAG sur notes de cours Obsidian (ISIA — INSA Rouen)"
readme = "README.md"
authors = [
    { name = "Selasi Maclean", email = "smaclean@insa-rouen.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.25.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
rag-cours = "rag_cours:main"
rag-ingest = "rag_cours.ingest:main"
rag-embed = "rag_cours.embed:main"
rag-query = "rag_cours.query:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
